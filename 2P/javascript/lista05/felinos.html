<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/index.js" defer></script>
    <script src="js/menu.js" defer></script>
    <script src="js/felinos.js" defer></script>
    <title>Jogo dos Felinos</title>
</head>
<body>
    <div class="container-felinos">
        <div>
            <img src="img/gato01.gif" alt="" id="gato01">
            <p>Clique em mim!</p>
        </div>
        <div>
            <img src="img/gato02.gif" alt="" id="gato02">
            <p>Clique sobre mim várias vezes!</p>
            <p id="carinhos">Carinhos: 0</p>
        </div>
        <div>
            <img src="img/gato03.gif" alt="" id="gato03">
            <p>Passe o cursor do mouse sobre mim!</p>
        </div>
        <div>
            <img src="img/gato04.gif" alt="" id="gato04">
            <p id="textoGato04">lá lá lá lá lá</p>
        </div>
        <div>
            <img src="img/gato05.gif" alt="" id="gato05">
            <input type="button" value="Gerar número da sorte" class="botao-sorte" id="botaoSorte">
            <input type="text" id="inputSorte" readonly>
        </div>
    </div>
</body>
</html>
